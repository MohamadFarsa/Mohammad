<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mohammad Amin — Computer Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #080C12;
      --surface:  #0E1420;
      --border:   #1C2535;
      --accent:   #00D4FF;
      --accent2:  #0066FF;
      --text:     #E8EDF5;
      --muted:    #5A6478;
      --mono:     'JetBrains Mono', monospace;
      --sans:     'Space Grotesk', sans-serif;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Grid noise texture ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,212,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Glow orbs ── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(0,102,255,.18) 0%, transparent 70%);
      top: -150px; left: -150px;
    }
    .orb-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(0,212,255,.12) 0%, transparent 70%);
      bottom: -100px; right: -100px;
    }

    /* ── Wrapper ── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      gap: 0;
    }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(0,212,255,.06), 0 32px 80px rgba(0,0,0,.6);
      animation: fadeUp .7s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Header strip ── */
    .card-header {
      position: relative;
      padding: 40px 36px 32px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, #0E1420 0%, #101828 100%);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(0,212,255,.08);
      border: 1px solid rgba(0,212,255,.2);
      border-radius: 100px;
      padding: 5px 12px;
      margin-bottom: 20px;
    }
    .tag::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: .3; }
    }

    .name {
      font-size: clamp(28px, 7vw, 36px);
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: 1.1;
      color: var(--text);
    }
    .name span {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .title {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
      margin-top: 10px;
      letter-spacing: .06em;
    }

    /* corner decoration */
    .card-header::after {
      content: '</>';
      position: absolute;
      top: 24px; right: 28px;
      font-family: var(--mono);
      font-size: 13px;
      color: rgba(0,212,255,.18);
      letter-spacing: .04em;
    }

    /* ── Links section ── */
    .card-body {
      padding: 28px 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.02);
      text-decoration: none;
      color: var(--text);
      transition: background .2s, border-color .2s, transform .15s;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      animation: fadeUp .7s cubic-bezier(.22,1,.36,1) both;
    }
    .link-btn:nth-child(1) { animation-delay: .12s; }
    .link-btn:nth-child(2) { animation-delay: .18s; }
    .link-btn:nth-child(3) { animation-delay: .24s; }
    .link-btn:nth-child(4) { animation-delay: .30s; }
    .link-btn:nth-child(5) { animation-delay: .36s; }

    .link-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.03), transparent);
      transform: translateX(-100%);
      transition: transform .4s;
    }
    .link-btn:hover::before { transform: translateX(100%); }
    .link-btn:hover {
      background: rgba(0,212,255,.06);
      border-color: rgba(0,212,255,.3);
      transform: translateY(-2px);
    }
    .link-btn:active { transform: translateY(0) scale(.98); }

    .icon-wrap {
      width: 40px; height: 40px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 18px;
    }

    .btn-meta { flex: 1; }
    .btn-platform {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 2px;
      font-size: 13px;
    }
    .btn-handle {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .arrow {
      font-size: 14px;
      color: var(--muted);
      transition: color .2s, transform .2s;
    }
    .link-btn:hover .arrow {
      color: var(--accent);
      transform: translateX(3px);
    }

    /* icon colors */
    .ic-telegram  { background: rgba(0,136,204,.15); color: #29B6F6; }
    .ic-instagram { background: rgba(193,53,132,.15); color: #E91E8C; }
    .ic-whatsapp  { background: rgba(37,211,102,.15); color: #25D366; }
    .ic-github    { background: rgba(255,255,255,.08); color: #C9D1D9; }

    /* ── Footer ── */
    .card-footer {
      border-top: 1px solid var(--border);
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .footer-badge {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--accent);
      letter-spacing: .06em;
      opacity: .6;
    }

    

    /* ── SVG icons inline ── */
    svg { display: block; }
  </style>
</head>
